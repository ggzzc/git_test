# ==================================================================
# CI —— 编译测试 + 静态检查（阶段 2 的全部内容）
# ------------------------------------------------------------------
# 本文件包含 4 个作业：
#   1) build-and-test   4 平台编译 + 单元测试（gcc / clang / AppleClang / MSVC）
#   2) strict-warnings  告警即错误（GCC/Clang 的 -Werror、MSVC 的 /WX）
#   3) cppcheck         源码级静态分析（空指针、越界、作用域、冗余代码等）
#   4) clang-tidy       基于 compile_commands.json 的语义级检查
# ------------------------------------------------------------------
# 说明：build-and-test 刻意使用"原始 CMake 命令"而不是本仓库的预设，
#       因为预设里的 mingw 使用 MinGW Makefiles 生成器，Linux/macOS runner 没有它。
# ==================================================================
name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

# 同一分支连续推送时取消上一个未跑完的任务，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macos-clang
            os: macos-latest
            cc: clang
            cxx: clang++
          # Windows 用默认生成器（Visual Studio 2022）。
          # VS 生成器不读取 CC/CXX 环境变量，因此这里留空。
          - name: windows-msvc
            os: windows-latest
            cc: ''
            cxx: ''
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      # checkout v5 面向 Node.js 24；v4 面向 Node.js 20，会触发
      # "Node.js 20 is deprecated" 警告（每个作业一条，共 7 条）
      - name: 检出代码
        uses: actions/checkout@v5

      # 单配置生成器（Linux/macOS 的 Unix Makefiles）：构建类型在配置阶段决定
      - name: 配置（单配置生成器）
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # 多配置生成器（Windows 的 Visual Studio）：构建类型在编译阶段用 --config 决定，
      # 这里传 CMAKE_BUILD_TYPE 是无效的，会打印 "Manually-specified variables were not used" 警告
      - name: 配置（多配置生成器）
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: 编译
        run: cmake --build build --config Release --parallel

      - name: 单元测试
        run: ctest --test-dir build -C Release --output-on-failure

      - name: 冒烟运行 demo（非 Windows）
        if: runner.os != 'Windows'
        run: ./build/calc_demo

  # ==================================================================
  # 第 2 步：严格告警（告警即错误）
  #   ENABLE_WERROR=ON -> GCC/Clang 追加 -Werror、MSVC 追加 /WX
  #   与 build-and-test 的区别：那边的告警只是打印，这里的告警直接让作业失败
  # ==================================================================
  strict-warnings:
    name: strict warnings (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            configureArgs: '-DCMAKE_BUILD_TYPE=Release'
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            configureArgs: '-DCMAKE_BUILD_TYPE=Release'
          # 多配置生成器（Visual Studio）不使用 CMAKE_BUILD_TYPE，
          # 因此这里留空不传，构建类型交给下面的 --config Release。
          - name: windows-msvc
            os: windows-latest
            cc: ''
            cxx: ''
            configureArgs: ''
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置（开启 -Werror / /WX）
        run: cmake -S . -B build-strict ${{ matrix.configureArgs }} -DENABLE_WERROR=ON

      - name: 编译（只要有一条告警就失败）
        run: cmake --build build-strict --config Release --parallel

      - name: 单元测试（严格模式下也确认行为不变）
        run: ctest --test-dir build-strict -C Release --output-on-failure

  # ==================================================================
  # 第 3 步：cppcheck 静态分析
  #   与编译无关：直接扫描源码找空指针、越界、未初始化、冗余代码、
  #   可移植性问题等。--error-exitcode=1 -> 只要有一处发现就让作业失败。
  #   只跑 Linux 即可：分析的是源码，结果与平台无关。
  # ==================================================================
  cppcheck:
    name: static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --version

      - name: 运行 cppcheck
        run: |
          cppcheck \
            --enable=warning,performance,portability,style \
            --error-exitcode=1 \
            --std=c11 \
            --language=c \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --template='{file}:{line}: {severity}: {message} [{id}]' \
            -Iinc \
            src tests

  # ==================================================================
  # 第 4 步：clang-tidy 语义级检查
  #   与 cppcheck 的区别：clang-tidy 需要 compile_commands.json，
  #   用真实编译参数（-std=c11、-Iinc）建立 AST 后再检查，
  #   能发现类型转换、控制流、API 误用等更"语义"的问题。
  #   检查项与"告警即错误"都定义在仓库根的 .clang-tidy 里，
  #   因此本地跑同样的命令就能复现 CI 的结论。
  # ==================================================================
  clang-tidy:
    name: static analysis (clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 clang 与 clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy
          clang --version
          clang-tidy --version

      # 编译数据库用 clang 生成，保证 clang-tidy 拿到的参数与实际编译器一致
      - name: 生成 compile_commands.json
        run: cmake -S . -B build-tidy -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug

      - name: 运行 clang-tidy
        run: |
          clang-tidy -p build-tidy src/calc.c src/main.c tests/test_calc.c
