# ==================================================================
# Release —— 打 tag 时构建并发布可执行文件（CD）
# ------------------------------------------------------------------
# 触发：推送形如 v* 的标签，例如
#     git tag -a v0.2.0 -m "v0.2.0: ..."
#     git push origin v0.2.0
# 结构（两个作业）：
#   build   —— 矩阵编译 linux/windows，各自把产物作为 artifact 上传
#   publish —— 单作业串行执行：下载全部 artifact、生成覆盖所有平台的
#              SHA256SUMS.txt、一次性创建 Release
#   这样做的原因：
#     ① 校验和清单覆盖所有平台，不会像"每个平台各传一份同名文件"那样互相覆盖；
#     ② 创建 Release 的逻辑只有一处，不存在并发竞争。
#
# 为什么用 gh CLI 而不是 softprops/action-gh-release 这类第三方 action：
#   * gh 已预装在 GitHub 托管的 runner 上，无需再引入依赖
#   * 少一个供应链环节，也不会因为 action 的 Node 运行时升级而收到弃用警告
# ==================================================================
name: Release

on:
  push:
    tags: ['v*']

# 创建 / 更新 Release 需要写权限（GITHUB_TOKEN 默认是只读的）
permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # 1) 构建：矩阵编译两个平台，产物以 artifact 形式交给 publish 作业
  # ------------------------------------------------------------------
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      # 单配置生成器：构建类型在配置阶段决定
      - name: 配置（单配置生成器）
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # 多配置生成器：不传 CMAKE_BUILD_TYPE，构建类型交给 --config
      - name: 配置（多配置生成器）
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: 编译
        run: cmake --build build --config Release --parallel

      # 发布前把关：测试不过就不发
      - name: 单元测试
        run: ctest --test-dir build -C Release --output-on-failure

      # 统一产物命名。校验和统一交给 publish 作业生成，
      # 这样两个平台不会各传一份同名清单而互相覆盖。
      - name: 打包
        shell: bash
        run: |
          mkdir -p dist
          if [ -f build/calc_demo ]; then
            cp build/calc_demo "dist/calc_demo-${{ matrix.name }}"
          else
            cp build/Release/calc_demo.exe "dist/calc_demo-${{ matrix.name }}.exe"
          fi
          ls -l dist

      - name: 上传为 artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 2) 发布：串行执行（needs: build），合并所有平台产物后一次性创建 Release
  # ------------------------------------------------------------------
  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 校验产物齐全并生成校验和清单
        shell: bash
        run: |
          cd dist
          ls -l
          count=$(ls calc_demo-* | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "预期 2 个平台产物，实际只有 $count 个" >&2
            exit 1
          fi
          # glob 写 calc_demo-*：若写成 * 会把刚创建的空 SHA256SUMS.txt 也算进去
          sha256sum calc_demo-* > SHA256SUMS.txt
          echo '--- SHA256SUMS.txt ---'
          cat SHA256SUMS.txt

      - name: 创建 Release 并上传全部产物
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag  repo=${GITHUB_REPOSITORY}"
          ls -l dist
          # 本作业没有 actions/checkout，工作区里没有 .git 目录，
          # gh 无法从 git remote 推断要操作哪个仓库，必须用 --repo 显式指定。
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes \
            --verify-tag
